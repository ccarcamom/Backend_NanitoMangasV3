# Producción (AWS EC2): MongoDB con usuario y contraseña, sin publicar el puerto de la base de datos,
# secretos en `.env` y reinicio automático. Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?falta MONGO_ROOT_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?falta MONGO_ROOT_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  ms-administracion:
    build: ./ms-administracion
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/nm_admin?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_KEY: ${INTERNAL_KEY:?falta INTERNAL_KEY en .env}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    depends_on:
      mongo:
        condition: service_healthy

  ms-vendedores:
    build: ./ms-vendedores
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/nm_vendedores?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_KEY: ${INTERNAL_KEY:?falta INTERNAL_KEY en .env}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    depends_on:
      mongo:
        condition: service_healthy

  ms-clientes:
    build: ./ms-clientes
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/nm_clientes?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_KEY: ${INTERNAL_KEY:?falta INTERNAL_KEY en .env}
      VENDEDORES_URL: http://ms-vendedores:8082
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    depends_on:
      mongo:
        condition: service_healthy
      ms-vendedores:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      ADMIN_URL: http://ms-administracion:8081
      VENDEDORES_URL: http://ms-vendedores:8082
      CLIENTES_URL: http://ms-clientes:8083
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    depends_on:
      - ms-administracion
      - ms-vendedores
      - ms-clientes

volumes:
  mongo-data:
